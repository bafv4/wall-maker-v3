[package]
name = "wall-maker-v3"
# ここは crate 自体のバージョン。Cargo には外部ファイル（package.json）を参照する手段が
# ないため、**リリース時に package.json の `version` と手動で合わせること**。
# アプリとして配布されるバージョンは `tauri.conf.json` の `version`（= `../package.json`
# 参照）が使われるので、ここがズレてもバンドル成果物のバージョンは package.json 由来になる。
version = "3.4.0"
description = "SeedQueue Wall Maker — Minecraft Speedrunning 用 SeedQueue リソースパックエディタ"
authors = ["bafv4"]
edition = "2021"
license = "GPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wall_maker_v3_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 更新チェック（GitHub Releases API）とリリースアセットのダウンロード用。
# rustls: OS の OpenSSL に依存しない（0.13 で rustls-tls から改名。暗号は aws-lc-rs、
# 証明書検証は OS の信頼ストア）。default-features 無効で不要機能（http2 / system-proxy 等）を落とす。
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
# ワンクリック更新でダウンロードした exe を GitHub の digest（SHA-256）と照合する。
sha2 = "0.11.1"

